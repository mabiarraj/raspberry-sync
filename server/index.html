<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            font-family: sans-serif;
        }

        #file {
            display: none;
        }

        label {
            padding: 24px 64px;
            border-radius: 16px;
            background: #22c55e;
            color: black;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input id="file" type="file" accept="image/*" onchange="upload()">
    <label for="file">Upload</label>

    <script>
        async function upload() {
            const file = document.getElementById("file").files[0]

            await fetch("/image", {
                method: "POST",
                headers: {
                    "Content-Type": "application/octet-stream"
                },
                body: file
            })

            alert("Uploaded!")
        }
    </script>
</body>
</html>
