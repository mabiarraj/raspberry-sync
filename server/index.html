<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: black;
            font-family: sans-serif;
        }

        img {
            width: min(90vw, 600px);
            max-height: 65vh;
            object-fit: contain;
            border-radius: 16px;
        }

        #file {
            display: none;
        }

        label {
            padding: 24px 64px;
            border-radius: 16px;
            background: #22c55e;
            color: black;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="current" src="/image" alt="Current photo">

    <input id="file" type="file" accept="image/*" onchange="upload()">
    <label for="file">Upload</label>

    <script>
        async function upload() {
            const file = document.getElementById("file").files[0]

            await fetch("/image", {
                method: "POST",
                headers: {
                    "Content-Type": "application/octet-stream"
                },
                body: file
            })

            document.getElementById("current").src = "/image?" + Date.now()
        }
    </script>
</body>
</html>
