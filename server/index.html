<!DOCTYPE html>
<html>
<body>
    <input id="file" type="file" accept="image/*">
    <button onclick="upload()">Upload</button>

    <script>
        async function upload() {
            const file = document.getElementById("file").files[0]

            await fetch("/image", {
                method: "POST",
                headers: {
                    "Content-Type": "application/octet-stream"
                },
                body: file
            })

            alert("Uploaded!")
        }
    </script>
</body>
</html>
